server {
  listen 80;
  root /usr/share/nginx/html;
  location / {
    add_header Cache-Control "no-cache";
  }
  # Progress sync: the page PUTs one JSON file, stored in the /data volume.
  location = /api/progress.json {
    alias /data/progress.json;
    dav_methods PUT;
    client_max_body_size 2m;
    client_body_temp_path /data/.tmp;
    add_header Cache-Control "no-store";
  }
}
